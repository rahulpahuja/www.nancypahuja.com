[build]
  # The directory where the React app lives
  base = "app"
  
  # The command to install dependencies and build the project
  command = "npm install && npm run build"
  
  # The directory Vite outputs to (relative to the base directory)
  publish = "dist"

[[redirects]]
  # This ensures React Router handles all routes correctly
  from = "/*"
  to = "/index.html"
  status = 200
